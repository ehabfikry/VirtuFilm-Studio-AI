// A common shot-list layout: a scene row carries Scene, Int/Ext, Time, Location, Synopsis, Thematic Intention, Notes;
// the shot rows under it carry a letter in Shot plus Shot Type, Shot Description, Special Tools, Notes.
const LIST_COLS=[['num','Scene',/^(sc|scene|scene ?(#|no\.?|number))$/],['shot','Shot',/^(shot|shot ?(#|no\.?|number))$/],['ie','Int/Ext',/^(int\/?ext|i\/?e)$/],['time','Time',/^(time|time of day|day\/?night|d\/?n)$/],['loc','Location',/^(location|set|loc)$/],
  ['type','Shot Type',/^(shot ?type|type|size|shot size)$/],['desc','Shot Description',/^(shot ?description|description|desc|action)$/],['tools','Special Tools',/^(special ?tools|tools|equipment|gear|rig)$/],['syn','Synopsis',/^(synopsis|scene description)$/],['intent','Thematic Intention',/^(thematic ?intention|intention|theme)$/],['notes','Notes',/^(notes?|comments?)$/]];
function splitRows(text){text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');const tab=text.includes('\t'),rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&cell==='')q=true;else if(ch===(tab?'\t':',')){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
// returns {scenes:[{num,ie,time,loc,syn,intent,notes,shots:[{letter,type,desc,tools,notes}]}], header:bool}
function parseShotList(text){const rows=splitRows(String(text||'')).slice(0,5000).map(r=>r.map(c=>c.trim()));const norm=c=>c.toLowerCase().replace(/\s+/g,' ').trim();
  let map=null,start=0;for(let i=0;i<Math.min(rows.length,10);i++){const m={};rows[i].forEach((c,j)=>{const n=norm(c);for(const [k,,re] of LIST_COLS)if(m[k]===undefined&&re.test(n))m[k]=j});if(m.num!==undefined&&(m.shot!==undefined||m.desc!==undefined)){map=m;start=i+1;break}}
  const header=!!map;if(!map){map={};LIST_COLS.forEach(([k],j)=>map[k]=j)}
  const get=(r,k)=>map[k]===undefined?'':(r[map[k]]||'').trim();const scenes=[];let curS=null;
  const newScene=(num,r)=>{curS={num,ie:get(r,'ie').toUpperCase(),time:get(r,'time').toUpperCase(),loc:get(r,'loc'),syn:get(r,'syn'),intent:get(r,'intent'),notes:'',shots:[]};scenes.push(curS);return curS};
  for(const r of rows.slice(start)){if(!r.some(Boolean))continue;let num=get(r,'num'),shot=get(r,'shot').toUpperCase();const shotBits={type:get(r,'type'),desc:get(r,'desc'),tools:get(r,'tools'),notes:get(r,'notes')};
    // "12a" in the Scene column, or "1.5a" in the Shot column
    let m=num.match(/^(\d+(?:\.\d+)?)\s*([a-z]{1,3})$/i);if(m&&!shot){num=m[1];shot=m[2].toUpperCase()}
    m=shot.match(/^(\d+(?:\.\d+)?)\s*([A-Z]{1,3})$/);if(m){if(!num)num=m[1];shot=m[2]}
    if(num&&(!curS||curS.num!==num))newScene(num,r);
    if(!curS)newScene('',r);
    if(!shot&&!shotBits.type&&!shotBits.desc){if(num){curS.notes=shotBits.notes;if(shotBits.tools)curS.tools=shotBits.tools}continue}
    if(!shot&&num&&!shotBits.type&&!shotBits.desc)continue;
    curS.shots.push({letter:/^[A-Z]{1,3}$/.test(shot)?shot:'',...shotBits})}
  return {scenes:scenes.filter(x=>x.shots.length||x.num),header}}
// merge into a location: a scene with the same number is updated, a shot with the same code is updated, anything else is added with no plan
function applyShotList(sc,parsed,keep){let addG=0,updG=0,addS=0,updS=0;const fresh=[];
  const locFor=(name,fb)=>{if(!name)return fb;const L=sc.locs.find(l=>l.name.toLowerCase()===name.toLowerCase());if(L)return L.id;const N={id:uid(),name:name.slice(0,120),notes:''};sc.locs.push(N);return N.id};
  for(const ps of parsed.scenes){if(keep&&!keep(ps))continue;let g=ps.num?sc.groups.find(x=>x.num===ps.num):null;
    if(!g){if(sc.shots.length+ps.shots.length>1000)break;
      const lone=sc.groups.length===1&&!sc.groups[0].num&&!sc.groups[0].name&&!sc.shots.some(x=>sc.items.some(i=>isPosed(i)&&i.shot===x.id))&&sc.shots.length===1&&!sc.shots[0].name&&!sc.shots[0].desc;
      if(lone){g=sc.groups[0];sc.shots=[]}else{g={id:uid(),num:'',name:'',ie:'',time:'',syn:'',locId:locFor(ps.loc,grpOf(sc,shotOf(sc)).locId)};sc.groups.push(g);fresh.push(g)}addG++}else updG++;
    if(ps.loc)g.locId=locFor(ps.loc,g.locId);
    for(const k of ['num','ie','time','syn','intent','notes'])if(ps[k])g[k]=ps[k].slice(0,k==='num'?12:k==='ie'?20:k==='time'?40:600);
    for(const x of ps.shots){const ex=x.letter&&sc.shots.find(y=>grpOf(sc,y)===g&&shotCode(sc,y)===sceneNum(sc,g)+x.letter);
      const set=(sh)=>{for(const [k,n] of [['type',40],['desc',400],['tools',120],['notes',600]])if(x[k])sh[k]=x[k].slice(0,n);if(x.letter)sh.letter=x.letter};
      if(ex){set(ex);updS++;continue}if(sc.shots.length>=1000)break;const sh={id:uid(),name:'',grp:g.id,beats:[{id:uid(),name:''}]};set(sh);sc.shots.push(sh);addS++}
    const xs=shotsIn(sc,g);if(xs.length&&xs.every(y=>y.letter)){const key=l=>l.length*100+Math.max(0,LETTERS.indexOf(l[0]));const sorted=[...xs].sort((a,b)=>key(a.letter)-key(b.letter));let k=0;sc.shots=sc.shots.map(y=>grpOf(sc,y)===g?sorted[k++]:y)}}
  if(!sc.shots.length)sc.shots.push({id:uid(),name:'',grp:sc.groups[0].id,beats:[{id:uid(),name:''}]});
  // a new scene at a location you've already dressed comes in dressed like the scene before it there
  for(const g of fresh){const p=prevAtLoc(sc,g);if(p)dressFrom(sc,g,p,['furn','text'])}
  unmount(sc);orderShots(sc);return {addG,updG,addS,updS,locs:sc.locs.length}}

  openSheet(`<h3>Import a shot list</h3><p class="hint" style="padding:0 16px">In Google Sheets or Excel, select the rows with the header row and copy, then paste here. Columns are matched by name: Scene, Shot, Int/Ext, Time, Location, Shot Type, Shot Description, Special Tools, Synopsis, Thematic Intention, Notes. A row with a scene number and no shot letter starts a scene; shots are the letters under it (A, B… or 25A). Each Location becomes a location here, shared by the scenes that name it.</p>
    <div class="form"><textarea id="listPaste" rows="6" placeholder="Paste rows here" style="font-size:14px"></textarea></div><div id="listPrev"></div>
    <div class="acts"><button class="btn" data-c="file">Choose a .csv…</button><button class="btn" data-c="cancel">Cancel</button><button class="btn primary" data-c="go" disabled>Import</button></div>`,e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
    if(c==='cancel')return closeSheet();
    if(c==='file'){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.tsv,.txt,text/csv,text/tab-separated-values';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;if(f.size>3e6){toast('That file is too big for a shot list');return}ta.value=await f.text();show()};inp.click();return}
    if(c==='go'&&parsed){pushHist();shotOf(sc);const r=applyShotList(sc,parsed,null);closeSheet();

    const locs=new Map();for(const x of parsed.scenes){const k=x.loc||'(no location)';locs.set(k,(locs.get(k)||0)+x.shots.length)}
    const known=[...locs.keys()].filter(k=>sc.locs.some(l=>l.name.toLowerCase()===k.toLowerCase())).length,named=[...locs.keys()].filter(k=>k!=='(no location)').length;
    prev.innerHTML=`<p class="hint" style="padding:0 16px">${parsed.scenes.length} scene${parsed.scenes.length===1?'':'s'}, ${n} shot${n===1?'':'s'}${parsed.header?'':' (no header row: read in the column order above)'}.${named?` ${named} location${named===1?'':'s'}${known?`, ${known} already here`:''}; a new location starts as an empty room.`:''}</p>`};
  ta.addEventListener('input',show);ta.addEventListener('paste',()=>setTimeout(show,0))}
// one row per scene, then one per shot, in his layout, with what the plan knows added on the right
function listRows(sc){const sm=summary(sc),out=[[...LIST_COLS.map(c=>c[1]),'Cameras','Talent','Beats']];const blank=()=>LIST_COLS.map(()=>'');
  sc.groups.forEach((g,gi)=>{const xs=shotsIn(sc,g);if(!xs.length&&!g.num&&sc.groups.length===1)return;const r=blank();const put=(row,k,v)=>row[LIST_COLS.findIndex(c=>c[0]===k)]=v||'';
    put(r,'num',sceneNum(sc,g));for(const k of ['ie','time','syn','intent','notes'])put(r,k,g[k]);put(r,'loc',locOf(sc,g).name);if(g.name)put(r,'syn',g.syn?`${g.name}: ${g.syn}`:g.name);out.push([...r,'','','']);
    for(const sh of xs){const row=blank(),info=sm.shots[sc.shots.indexOf(sh)];const code=shotCode(sc,sh);
      put(row,'shot',code.slice(sceneNum(sc,g).length));put(row,'type',sh.type);put(row,'desc',sh.name&&sh.desc?`${sh.name}: ${sh.desc}`:sh.name||sh.desc);put(row,'tools',sh.tools);put(row,'notes',sh.notes);
      const cams=info?info.cams.map(c=>{const ls=[...new Set(c.per.filter(Boolean).map(p=>p.spec.split(' · ')[0]))];return `${c.name} ${ls.join('/')}`.trim()}).join(', '):'';
      out.push([...row,cams,info?info.cast.join(', '):'',sh.beats.length>1?sh.beats.map((b,i)=>b.name||`Beat ${i+1}`).join(' / '):''])}});
  return out}

function addScenes(list,label){let last=null;for(const raw of list){if(!raw||typeof raw!=='object')continue;const id=uid();const n=normalize({...clone(raw),id});

/* ---------- round trip with any AI: copy the plan with instructions, paste the reply back ---------- */
const AI_NOTES=`Below is an overhead camera plan as JSON. Change it as I ask, then reply with the whole updated plan as one JSON object in a single \`\`\`json block, so I can paste it back into the app with Paste overhead.

How the plan works:
- Keep every id that exists. New things get new ids: letters, digits, - or _, up to 40 characters, unique across the whole plan.
- Units are feet and degrees. x runs right, y runs down the page; r is facing, clockwise from up (0 faces up the page).
- groups are the scenes, in story order (num, name, ie, time, syn, locId). locs are locations (id, name). shots belong to a scene (grp) and hold beats (id, name).
- wall, window, door and img items belong to a location (loc), or to one scene (grp) when that scene has ownArch. furn, light, frame (diffusion) and text items belong to a scene (grp); each scene has its own copies.
- char items are talent (cast: an id in cast, shot) and cam items are cameras (rig: an id in rig, shot). Each has k: exactly one pose per beat of its shot, in order. A pose has x, y, r, and out:true when that person or camera is not in that beat.
- Talent poses: ps is stand, walk, bar (30-inch stool) or chair; look is the id of a cam or char to face.
- Camera poses: f is the lens in mm, h the lens height in feet, aim a char id, ap the framing (l, c or r), aims further char ids held in frame. held:true only when every pose is the same.
- Adding a beat means adding a pose to every char and cam in that shot. Leave out nothing you don't mean to delete.

Plan:
`;
function copyForAI(sc){used('share.ai');const txt=AI_NOTES+JSON.stringify(strip(sc));

  const list=(Array.isArray(d)?d:d.scenes?d.scenes:d.scene?[d.scene]:[d]).filter(x=>x&&typeof x==='object'&&(x.items||x.shots||x.beats)).slice(0,20);

const shiftQ=(q,dx,dy)=>{const n={...q,x:q.x+dx,y:q.y+dy};if(q.cv)n.cv=[q.cv[0]+dx,q.cv[1]+dy];return n};
const everyBeat=(sc,it)=>S.gAll&&isPosed(it)&&sc.beats.length>1&&!(it.kind==='cam'&&it.held)&&(S.multi.length?S.multi.includes(it.id):it.kind==='char'&&S.gAllFor===it.id);
function moveBy(sc,it,dx,dy){if(everyBeat(sc,it)){it.k=it.k.map(q=>shiftQ(q,dx,dy));return}if(isPosed(it)){const p=poseAt(it,S.beat);setPoseF(it,S.beat,{...p,x:p.x+dx,y:p.y+dy})}else if(it.kind==='wall'){it.x1+=dx;it.x2+=dx;it.y1+=dy;it.y2+=dy}else{it.x+=dx;it.y+=dy}}
function turnBy(sc,it,da){if(isPosed(it)){const q0={...poseAt(it,S.beat),r:Math.round(poseT(sc,it,S.beat).r+da),aim:''};delete q0.aims;setPoseF(it,S.beat,q0)}
  else if(it.kind==='wall'){const cx=(it.x1+it.x2)/2,cy=(it.y1+it.y2)/2,[ax,ay]=rot(it.x1-cx,it.y1-cy,da),[bx,by]=rot(it.x2-cx,it.y2-cy,da);it.x1=cx+ax;it.y1=cy+ay;it.x2=cx+bx;it.y2=cy+by}else it.r=normA((it.r||0)+da)}
function keysSheet(){const K=[['← →','Previous / next beat (nothing selected)'],['1 – 9','Go to beat'],['PageUp / PageDown','Previous / next shot'],['Space','Play the beats'],['S','Switch between Set and Shots'],['T · C','Talent · Cameras'],['F','Fit the plan'],['N · Shift N','Select the next / previous item on the plan'],['Arrows','Nudge selection 3″ (Shift: 1 ft)'],['[  ]','Turn selection 15° (Shift: 1°)'],['⌘/Ctrl D','Duplicate selection'],['⌘/Ctrl A','Select everything visible'],['Shift-drag','Box select (on empty plan)'],['Shift-click','Add to selection'],['Alt while dragging','Skip snapping; move a group in every beat (or choose Every beat when a group is selected)'],['Delete','Delete selection'],['⌘/Ctrl Z · ⇧⌘Z','Undo · Redo'],['Esc','Deselect / close']];
  openSheet(`<h3>Keyboard</h3><div class="list">${K.map(([k,d])=>`<div class="item" style="cursor:default"><b style="min-width:150px;font-family:var(--f-ui)">${k}</b><span>${d}</span></div>`).join('')}</div>`,()=>{})}
document.addEventListener('keydown',e=>{
  const k=e.key,mod=e.metaKey||e.ctrlKey;if(S.busy){if(!e.target.matches('input,textarea,select'))e.preventDefault();return}
  if(e.target.matches('input,textarea,select')){if(k==='Escape'){e.target.blur();if(!$('#sheet').hidden)closeSheet()}
    else if(k==='Enter'&&e.target.matches('#sheet input')){const pb=$('#sheet .acts .primary');if(pb){e.preventDefault();pb.click()}}return}
  if(mod&&(k==='z'||k==='Z')){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&(k==='y'||k==='Y')){e.preventDefault();redo();return}
  if(!$('#sheet').hidden){if(k==='Escape')closeSheet();return}
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,[role=button],a,summary'))return;
  const sc=cur();if(!sc)return;
  if(!mod&&!e.shiftKey){const lk=k.toLowerCase();if(lk==='s'){e.preventDefault();S.jump=null;setSpace(S.space==='set'?'shots':'set');return}if(lk==='f'){e.preventDefault();fit();return}
    if(lk==='t'&&S.space!=='set'){e.preventDefault();castSheet();return}if(lk==='c'&&S.space!=='set'){e.preventDefault();rigSheet();return}}
  if((k==='n'||k==='N')&&!mod){const list=inShot(sc).filter(i=>!layerHidden(sc,i)&&!layerLocked(sc,i));if(!list.length)return;e.preventDefault();
    const i=list.findIndex(x=>x.id===S.sel),nx=list[(i+(e.shiftKey?-1:1)+list.length)%list.length];S.sel=nx.id;S.multi=[];S.sceneInsp=false;renderAll();ensureVisible();
    $('#sr').textContent=`${nx.name||nx.label||FURN[nx.shape]?.n||nx.kind}, ${({char:'talent',cam:'camera'})[nx.kind]||nx.kind}, beat ${S.beat+1}`;return}
  const sel=S.multi.length?[...S.multi]:S.sel?[S.sel]:[];const items=sel.map(id=>sc.items.find(i=>i.id===id)).filter(Boolean);
  if(mod&&(k==='d'||k==='D')){e.preventDefault();if(S.multi.length)runAct('gdup');else if(S.sel)runAct('dup');return}
  if(mod&&(k==='a'||k==='A')){e.preventDefault();S.multi=inShot(sc).filter(i=>!layerHidden(sc,i)&&!layerLocked(sc,i)&&!(isPosed(i)&&poseAt(i,S.beat).out)).map(i=>i.id);S.sel=null;S.sceneInsp=false;renderAll();return}
  if(k==='Delete'||k==='Backspace'){if(S.multi.length)runAct('gdel');else if(S.sel)runAct('del');return}
  if(k==='Escape'){if(S.playing){S.playing=false;S.t=null}S.sel=null;S.multi=[];S.sceneInsp=false;if(!jumpBack())renderAll();return}
  if(k.startsWith('Arrow')&&items.length&&!mod){e.preventDefault();const st=e.shiftKey?1:.25;const dx=k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,dy=k==='ArrowUp'?-st:k==='ArrowDown'?st:0;
    const mv=items.filter(i=>!i.lock);if(!mv.length)return;nudgeStep(sel);mv.forEach(i=>moveBy(sc,i,dx,dy));render();renderFrames();saveSoon();return}
  const rk={'[':-1,']':1,'{':-1,'}':1}[k];
  if(rk&&items.length){e.preventDefault();const mv=items.filter(i=>!i.lock);if(!mv.length)return;nudgeStep(sel);mv.forEach(i=>{const da=rk*(e.shiftKey?1:15);if(S.gAll&&S.multi.length&&isPosed(i))i.k=i.k.map(q=>{const n={...q,r:Math.round(q.r+da)};if(i.kind==='cam'){n.aim='';delete n.aims}return n});else turnBy(sc,i,da)});render();renderFrames();renderInsp();saveSoon();return}
  if(S.space==='set'&&(k==='ArrowRight'||k==='ArrowLeft'||k===' '||(/^[1-9]$/.test(k)&&!mod)))return;
  if(k==='ArrowRight'||k==='ArrowLeft'){S.beat=clamp(S.beat+(k==='ArrowRight'?1:-1),0,sc.beats.length-1);S.t=null;renderAll();return}
  if(k==='PageDown'||k==='PageUp'){e.preventDefault();goShot(sc.shots.indexOf(shotOf(sc))+(k==='PageDown'?1:-1));return}
  if(/^[1-9]$/.test(k)&&!mod){const i=+k-1;if(i<sc.beats.length){S.beat=i;S.t=null;renderAll()}return}
  if(k===' '){e.preventDefault();play();return}
  if(k==='?'){keysSheet()}});
