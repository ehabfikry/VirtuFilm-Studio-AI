<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Cindy Flow Bridge</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #07090e;
      color: #e2e8f0;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e2638;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4285f4, #9d4edd, #e6af2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      color: #e6af2e;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: #0d111a;
      border: 1px solid #1e2638;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .badge-ok {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-wait {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
    }
    .btn {
      width: 100%;
      background: linear-gradient(90deg, #4285f4, #2563eb);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">🎬</div>
    <div>
      <div class="title">Cindy Flow Bridge</div>
      <div class="subtitle">جسر الربط التلقائي مع جوجل فلو</div>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span>سيرفر سيندي المحلي:</span>
      <span id="server-status" class="badge-wait">فحص الاتصال...</span>
    </div>
    <div class="status-row" style="margin-top: 8px;">
      <span>تبويب Google Flow:</span>
      <span id="tab-status" class="badge-wait">جارٍ البحث...</span>
    </div>
  </div>

  <button id="btn-sync" class="btn">
    <span>مزامنة واختبار الجسر الآن</span>
  </button>

  <div class="footer">
    سيندي | Cindy AI Director v2.5 — Localhost 127.0.0.1
  </div>

  <script src="popup.js"></script>
</body>
</html>
